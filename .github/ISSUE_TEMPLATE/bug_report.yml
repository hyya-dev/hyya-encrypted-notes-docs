name: Bug report
description: Something in hYYa Encrypted Notes isn't working right
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please never include your notes, your passphrase or anything private. Security problems go to SECURITY.md, not here."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the app's page in the App Store or Google Play
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options: [iPhone, iPad, Mac, Android phone, Android tablet]
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: System version
      description: e.g. iOS 26.1, macOS 26.1, Android 15
  - type: dropdown
    id: sync
    attributes:
      label: How are your notes synced?
      options: [iCloud, Google Drive, iCloud and Google Drive, On this device only, Not sure]
